<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestion des étudiants</title>
</head>
<body>
    <form action="">
        <h1>Voici le formulaire d'ajout des étudiants</h1>
        <fieldset class="mon_formulaire">
            <legend>Informations personnelle</legend>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="nom">Nom</label></td>
                        <td><input type="text" id="nom" name="nom"></td>
                    </tr>
                </table>
            </div>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="prenom">Prenom</label></td>
                        <td><input type="text" id="prenom" name="prenom"></td>
                    </tr>
                </table>  
            </div>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="date_de_naissance">Date de naissance</label></td>
                        <td><input type="date" id="date_de_naissance" name="date_de_naissance"></td>
                    </tr>
                </table>  
            </div>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="addr_mail">mail</label></td>
                        <td><input type="mail" id="addr_mail" name="addr_mail" required></td>
                    </tr>
                </table>
            </div>
        </fieldset>
        <fieldset class="mon_formulaire">
            <legend>Inscription</legend>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="filiere">Filière</label></td>
                        <td><input type="text" id="filiere" name="filiere"></td>
                    </tr>
                </table>
            </div>
            <div class="champ">
                <table>
                    <tr>
                        <td><label for="date_ins">Date d'inscription</label></td>
                        <td><input type="date" id="date_ins" name="date_ins"></td>
                    </tr>
                </table>    
            </div>
        </fieldset>
        <div class="btn">
             <button class="envoyer">ENVOYER</button>
             <button class="reini">REINITIALISER</button>
        </div>
    </form>
    
</body>
</html>
